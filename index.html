<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Pokédex</title>
</head>
<body>
  <h1>Pokédex</h1>
  <input id="search" type="search" placeholder="Type a name, like pikachu">
  <button id="go">Search</button>
  <div id="result"></div>

  <script>
    const cache = {}; // remember what we've already fetched

    async function getPokemon(name) {
      if (cache[name]) return cache[name];
      const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
      if (!response.ok) return null; // 404 means no Pokémon with that name
      const data = await response.json();
      cache[name] = data;
      return data;
    }

    function show(pokemon) {
      const result = document.getElementById("result");
      if (!pokemon) {
        result.innerHTML = "<p>Pokémon not found. Check the spelling.</p>";
        return;
      }
      const types = pokemon.types.map(t => t.type.name).join(", ");
      const stats = pokemon.stats
        .map(s => `<li>${s.stat.name}: ${s.base_stat}</li>`)
        .join("");
      result.innerHTML = `
        <h2>${pokemon.name}</h2>
        <img src="${pokemon.sprites.front_default}" alt="${pokemon.name}">
        <p>Type: ${types}</p>
        <ul>${stats}</ul>`;
    }

    async function search() {
      const name = document.getElementById("search").value.trim().toLowerCase();
      if (!name) return;
      show(await getPokemon(name));
    }

    document.getElementById("go").addEventListener("click", search);
    document.getElementById("search").addEventListener("keydown", e => {
      if (e.key === "Enter") search();
    });
  </script>
</body>
</html>
